# Render Blueprint: usługa webowa z aplikacją Streamlit (plan bezpłatny)
services:
  - type: web
    name: anomalie-dostawy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
